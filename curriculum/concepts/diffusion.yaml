measurement:
  feasible: true
  evidenceRequirements:
    - "A bounded geometry and initial/boundary conditions recorded before the run"
    - "A tracer-medium pair whose interaction does not invalidate the chosen diffusion model, or an explicit effective-diffusion interpretation"
    - "Temperature recorded and held sufficiently stable for the intended comparison"
    - "Suppression or measurement of bulk convection so spreading is not mislabeled as diffusion"
    - "Fixed camera geometry/lighting or another calibrated concentration measurement method"
    - "Time-stamped repeated observations with spatial scale calibration"
    - "At least three independent replicates for any quantitative coefficient claim"
    - "Model-fit residuals or another goodness-of-fit check before calling the result Fickian"
    - "Raw images/data preserved separately from processed profiles and fitted parameters"

globeragRelevance:
  role: >-
    Research analogy and benchmark candidate only: diffusion is a compact example of
    local rules plus retained state producing a time-evolving global field. It can be
    used to test whether GlobeRAG correctly separates a physical model, its boundary
    conditions, observations, and model failure. No claim is made that knowledge or
    evidence should literally propagate according to Fick's law.
  claimStatus: HYPOTHESIS

failureBoundary: >-
  The constant-coefficient Fickian PDE is not a universal transport law. It must be
  revised or replaced when bulk advection matters; sources, sinks, or reactions occur;
  D depends strongly on concentration, temperature, position, direction, stress, or
  composition; multicomponent coupling changes the flux law; electrochemical or other
  driving forces dominate; boundaries or interfaces add resistance; microscopic
  mechanisms require discrete treatment; or measured spreading is anomalous/non-Fickian
  so mean-squared displacement does not scale linearly with time. In biology, simple
  diffusion cannot stand in for active transport or transporter-mediated processes.

unresolvedQuestions:
  - "Which prerequisite concepts should become canonical nodes before diffusion is promoted beyond exemplar status: gradient, local conservation, Laplacian, and PDE?"
  - "What deterministic diagnostic should KUP use to distinguish Fickian spreading from convection, reaction, concentration-dependent diffusion, and anomalous diffusion?"
  - "For the planned gel experiment, which tracer/gel pair gives the cleanest camera-measurable concentration profile without binding or concentration-dependent artifacts?"
  - "Can graph diffusion be a useful computational analogy for retrieval or evidence propagation without importing invalid physical semantics into GlobeRAG?"

