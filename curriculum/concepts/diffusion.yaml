problemItRepresents: >-
  How does a spatially non-uniform population, concentration, temperature-like field,
  or other conserved quantity spread through space over time when local microscopic
  motion produces a net flux down an admissible gradient? Diffusion supplies both a
  constitutive flux law and, when combined with conservation, a PDE for the time
  evolution of the field.

representation:
  type: equation
  notationRefs:
    - "c(x,t): concentration or conserved scalar field"
    - "J: flux vector, amount crossing unit area per unit time"
    - "D: diffusion coefficient; scalar only in the simplest isotropic model"
    - "grad(c): spatial concentration gradient"
    - "div(J): divergence of flux"
    - "laplacian(c): spatial Laplacian"
  equationText: >-
    Fick 1: J = -D grad(c); conservation: partial(c)/partial(t) + div(J) = 0;
    therefore, for constant scalar D with no advection, reaction, or source term,
    partial(c)/partial(t) = D laplacian(c).

physicalMeaning: >-
  The gradient states how rapidly concentration changes with position. The minus sign
  in Fick's first law means the net diffusive flux points from higher toward lower
  concentration under the stated model. D sets the time/length scale of spreading and
  has dimensions L^2/T. Conservation converts local flux imbalance into local change:
  if more material leaves a small region than enters it, its concentration falls.
  Microscopic motion can be random while the ensemble concentration field evolves
  predictably. The same mathematical structure can describe heat conduction under
  analogous assumptions, but the physical quantities and constitutive parameters are
  not interchangeable.

