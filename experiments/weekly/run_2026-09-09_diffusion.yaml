kupRelevance: >-
  Diffusion is a compact training object for the KUP learning method because the same
  representation crosses PDEs, chemistry, transport, biology, and materials, then
  becomes both executable simulation and a measurable experiment. The GlobeRAG link
  remains a hypothesis: KUP can use this run to practice separating model, evidence,
  calibration, boundary conditions, and admissible conclusions without claiming that
  information literally diffuses.

unresolvedQuestion: >-
  After the gel/camera experiment is run, do the measured profile widths and full
  spatial profiles support the constant-D Fickian model over the frozen range, or do
  residuals/replicates indicate concentration dependence, convection, interaction with
  the gel, or another non-Fickian mechanism?
