representation: >-
  Fick 1: J = -D grad(c). Combining that constitutive law with local conservation
  gives partial(c)/partial(t) = D laplacian(c) for constant scalar D with no
  advection, reaction, or source term.

physicalInterpretation: >-
  A spatial concentration gradient creates a net flux toward lower concentration
  under the Fickian model. The local concentration changes because neighboring fluxes
  do not exactly balance. D controls the spreading time scale and is a property of the
  species-medium-condition combination, not a universal constant.

workedExample: >-
  The committed 1-D simulation starts from a normalized Gaussian profile. For the
  constant-D model, its variance should grow as sigma^2(t) = sigma^2(0) + 2Dt. With
  D=1e-9 m^2/s and sigma(0)=0.003 m, the expected variance at 20,000 s is 4.9e-5 m^2.
  The deterministic artifact reproduces that value while conserving total mass to
  floating-point tolerance.

