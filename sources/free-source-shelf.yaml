  - sourceId: source_mit_pde_diffusion_18152
    title: "Syllabus | Introduction to Partial Differential Equations | Mathematics | MIT OpenCourseWare"
    url: "https://ocw.mit.edu/courses/18-152-introduction-to-partial-differential-equations-fall-2011/pages/syllabus/"
    doi: null
    publisher: "Massachusetts Institute of Technology OpenCourseWare"
    authorityTier: AUTHORITATIVE_INSTITUTION
    accessClass: FREE_OPEN
    language: English
    level: UNDERGRADUATE
    versionOrPublicationDate: "Fall 2011"
    lastVerified: "2026-09-09"
    whatItTeaches: "Places the diffusion equation among the fundamental PDEs and explicitly identifies it as a model for spreading heat energy and chemical diffusion processes."
    kupHorizontals: [mathematics, physics, chemistry, simulation]
    notEvidenceFor:
      - "A measured diffusion coefficient for any particular KUP material, crop, gel, sensor, or field system."
      - "The claim that every observed spreading process is Fickian diffusion."

  - sourceId: source_iupac_diffusion_coefficient
    title: "IUPAC - diffusion coefficient (D01719)"
    url: "https://goldbook.iupac.org/terms/view/D01719"
    doi: "10.1351/goldbook.D01719"
    publisher: "International Union of Pure and Applied Chemistry"
    authorityTier: AUTHORITATIVE_INSTITUTION
    accessClass: FREE_OPEN
    language: English
    level: UNDERGRADUATE
    versionOrPublicationDate: "2025, Gold Book online version 5.0.0"
    lastVerified: "2026-09-09"
    whatItTeaches: "Defines the diffusion coefficient D as the proportionality constant connecting amount flux to the negative concentration gradient, J_n = -D grad(c_B)."
    kupHorizontals: [chemistry, transport-phenomena, measurement-science-metrology]
    notEvidenceFor:
      - "A universal constant value of D; diffusion coefficients depend on species, medium, temperature, composition, and model assumptions."
      - "Validity of a constant scalar diffusion coefficient in multicomponent, anisotropic, heterogeneous, or non-Fickian systems."

