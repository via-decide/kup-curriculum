    level: UNDERGRADUATE
    versionOrPublicationDate: "2002, Molecular Biology of the Cell 4th edition"
    lastVerified: "2026-09-09"
    whatItTeaches: "Explains passive transport down concentration or electrochemical gradients, distinguishes simple diffusion from channel/carrier-mediated transport, and explains why membrane permeability depends strongly on solute properties."
